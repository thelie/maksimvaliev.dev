[package]
name = "maksimvaliev-dev"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "0.8.0", optional = true }
futures-util = { version = "0.3.34", default-features = false, optional = true }
rustls-acme = { version = "0.15.4", default-features = false, features = ["axum", "ring", "webpki-roots"], optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
brotli = "9.0.0"
flate2 = "1.1.10"
maud = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
tar = "0.4.46"
toml = "1.1.8"

[features]
default = ["tls"]
# Built-in HTTPS with automatic Let's Encrypt certificates.
tls = ["dep:rustls-acme", "dep:axum-server", "dep:futures-util"]
