tagline = "Продвижение без рекламного бюджета."
description = "Авторской системе питания Анастасии Шлотгауэр — готовые рационы с доставкой по Челябинску — нужны были заказы без бюджета на рекламу. Сделал стратегию продвижения, брендбук, ролики и карусели для Instagram и сайт gaurefood.ru: PageSpeed 100 на телефоне и компьютере, A+ в SSL Labs, Mozilla Observatory и securityheaders.com."
